apis:
- name: Stacklet Platform API
  description: 'The Stacklet Platform GraphQL API is the control plane for the governance
    platform: cloud accounts and account groups, policies and policy collections,
    bindings (the deployment of a policy collection against an account group), policy
    repositories, users, SSO groups, roles and role assignments, report groups and
    notification configuration profiles. It is served per customer deployment at
    https://api.<instance>.stacklet.io/ and is the surface behind the stacklet-admin
    CLI, the official Terraform provider, and the Platform toolset of the Stacklet
    MCP server. Introspection and the published schema require an authenticated
    deployment, so no anonymous SDL could be captured.'
  humanURL: https://stacklet.ai/platform-overview/
  baseURL: https://api.{instance}.stacklet.io/
  tags:
  - GraphQL
  - Cloud Governance
  - Policy as Code
  properties:
  - type: Authentication
    url: authentication/stacklet-authentication.yml
  - type: Conventions
    url: conventions/stacklet-conventions.yml
  - type: DataModel
    url: data-model/stacklet-data-model.yml
  - type: RateLimits
    url: rate-limits/stacklet-rate-limits.yml
- name: Stacklet MCP Server
  description: 'An open-source Model Context Protocol server, published by Stacklet
    and distributed on PyPI as stacklet-mcp, that grants an LLM three toolsets against
    a Stacklet deployment: AssetDB SQL queries (ad hoc and saved), Platform GraphQL
    operations with large dataset export, and read access to the deployment
    documentation. It runs locally over stdio and authenticates as the user logged in
    through the stacklet-admin CLI; write operations (saving queries, archiving
    queries, executing GraphQL mutations) are disabled by default and must be opted
    into with explicit environment variables.'
  humanURL: https://github.com/stacklet/mcp-server
  baseURL: https://api.{instance}.stacklet.io/
  tags:
  - MCP
  - Agents
  tags_raw:
  - Model Context Protocol
  - Agents
  properties:
  - type: MCPServer
    url: mcp/stacklet-mcp.yml
  - type: SourceCode
    url: https://github.com/stacklet/mcp-server
