aid: stacklet
name: Stacklet
description: 'Stacklet is a cloud governance company founded by the creators of Cloud
  Custodian, the open-source rules engine it stewards. Its Governance-as-Code platform
  runs Cloud Custodian policies as a managed service across AWS, Azure and GCP and adds
  AssetDB, a SQL-queryable warehouse of cloud resources, costs, tags and relationships;
  IaC governance for shift-left policy scanning; and the Jun0 agentic layer. The platform
  is driven by a per-customer GraphQL API served at https://api.<instance>.stacklet.io,
  a first-party Python CLI (stacklet-admin), an official Terraform provider, and an
  open-source Model Context Protocol server that exposes AssetDB SQL, Platform GraphQL
  and documentation tools to AI agents. The company operates its marketing surface at
  stacklet.ai, to which stacklet.io redirects.'
